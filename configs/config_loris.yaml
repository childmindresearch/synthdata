  # Explicit natural-order encoding for the one ordinal column stored as text
  # rather than an already-numeric Likert code (loris_variable_types.csv
  # classifies BIA__BIA_Activity_Level as `ordinal, known ordered category
  # (override)` -- now correctly included in ordinal_columns above, in addition
  # to being mapped here). Without this mapping, BIA__BIA_Activity_Level's raw
  # text values would crash refidiff's numeric-matrix conversion with
  # `ValueError: could not convert string to float: 'Exceptional'`; with it,
  # the column is encoded to integers 0-4 in its true order *before*
  # nominal_columns/ordinal_columns are resolved, then bit-encoded/decoded
  # like every other ordinal column (see refidiff_backend's
  # _fit_categorical_binary_encoders, which sorts by natural value -- i.e. this
  # true order -- rather than alphabetically).
  ordinal_column_categories:
    BIA__BIA_Activity_Level: [Very Light, Light, Moderate, Heavy, Exceptional]
    BIA__BIA_Frame: [Small, Medium, Large]

  uppercase_columns: false
  remap_binary_one_two: false # not needed: binary columns here are already coded {0, 1}

  # A handful of raw numeric columns carry implausible outlier values -- either
  # "not administered" sentinel codes (e.g. a lone 999 among otherwise 0-30
  # day-count values in WHODAS_SR__WHODAS_SR_Days01-03 and the Pegboard
  # peg_time_* columns) or corrupted derived values (e.g. a single-row
  # BIA__BIA_DEE of 124728 among otherwise ~1500-3000 values -- confirmed to
  # cascade across every BIA__* derived metric for the same handful of rows,
  # presumably from a bad denominator upstream). Left as-is, these overflow
  # TabPFN's/TabImpute's internal float32 computations (confirmed empirically --
  # "Input X contains infinity" partway through a TabPFN raw-data fit).
  #
  # Deliberately an explicit column list, not "check every numeric column":
  # z-score outlier checks false-positive heavily on this dataset's many
  # zero-/mode-inflated ordinal/Likert survey items (e.g. RBS__RBS_13 is a
  # legitimate 0-3 severity scale where 0 is >98% of responses -- a blanket
  # check flagged its real 2s/3s as "outliers" with z-scores >10, confirmed
  # empirically). Only list columns confirmed to have genuine sentinel/corrupt
  # values here, not just a skewed distribution. 8 standard deviations is
  # generous enough to keep genuine heavy-tailed clinical values on these
  # specific columns while catching the confirmed outliers.
  outlier_zscore_threshold: null
  outlier_columns:
    - BIA__BIA_DEE
    - BIA__BIA_BMR
    - BIA__BIA_FFM
    - BIA__BIA_Fat
    - BIA__BIA_TBW
    - BIA__BIA_LST
    - BIA__BIA_BMC
    - BIA__BIA_SMM
    - BIA__BIA_ECW
    - BIA__BIA_LDM
    - BIA__BIA_ICW
    - BIA__BIA_Height
    - BIA__BIA_Weight
    - BIA__BIA_FFMI
    - BIA__BIA_FMI
    - BIA__BIA_BMI
    - Pegboard__peg_time_d
    - Pegboard__peg_time_nd
    - WHODAS_SR__WHODAS_SR_Days01
    - WHODAS_SR__WHODAS_SR_Days02
    - WHODAS_SR__WHODAS_SR_Days03
    - NLES_P__NLES_P_Upset_Avg
    - NLES_SR__NLES_SR_Upset_Avg

  train_size: 0.6667
  stratify: true

  data_dir: data/loris
  raw_cache_subdir: raw

imputation:
  enabled: true
  # tabimpute (TabPFN-based) one-hot-encodes every nominal_columns/
  # ordinal_columns entry before imputing, which CUDA-OOMs at this dataset's
  # width (see the nominal_columns/ordinal_columns comment above). refidiff
  # uses a per-column predictive warm-up (XGBoost/CatBoost) + Mamba-based EDM
  # diffusion refinement instead, with binary (log2(k)-bit) categorical
  # encoding rather than one-hot -- confirmed to scale to this dataset's width
  # where tabimpute does not. Requires the `refidiff` optional dependency
  # group (`uv sync --extra refidiff`); see /memories/repo/refidiff-notes.md
  # for the exact mamba-ssm/causal-conv1d version pins verified to build/run.
  method: refidiff
  device: auto
  round_rules: {}
  # false (unlike the hepatitis example): ~1000 of this dataset's feature
  # columns are genuine assessment measures (ages with fractional years, BIA/
  # physical measurements, raw/standardized/percentile test scores) where
  # snapping to the nearest integer would destroy real precision. Ordinal
  # columns (including BIA__BIA_Activity_Level, see ordinal_columns above)
  # don't need this either -- every backend already recovers clean, correctly-
  # ordered category values for columns listed in nominal_columns/
  # ordinal_columns, so the blanket post-hoc rounding step is unnecessary here.
  round_to_int_default: false
  cache: true
  validation_margin: 0.2

  refidiff:
    # Defaults mirror the RefiDiff paper's own hyperparameters. Not yet
    # tuned against this dataset's actual runtime/memory footprint -- revisit
    # once Phase 7 (a real end-to-end run) reports observed numbers.
    hidden_dim: 32
    epochs: 10001
    early_stopping_patience: 500
    batch_size: 8192
    num_steps: 50
    num_trials: 10
    denoiser: auto # auto | mamba | mlp -- "auto" uses mamba-ssm if importable, else falls back to an MLP denoiser
    checkpoint_every: 1000

generation:
  n_samples: 1000
  output_dir: output/loris/synthetic_data
  force_retrain: false

  synthcity:
    enabled: true
    # bayesian_network excluded: structure learning does not scale to ~1000
    # variables (feasible for hepatitis's 19 columns, not here). privbayes/decaf
    # excluded for the same reason they were excluded from the hepatitis
    # example (unstable training). Re-test the rest of the list at this scale
    # before assuming timings from the hepatitis notebook transfer directly --
    # expect meaningfully longer per-model fit times than a 19-column dataset.
    #
    # ddpm excluded: its training loss (mloss, the multinomial/categorical
    # term) reliably goes inf -> NaN within the first couple of optimizer
    # steps on this dataset (reproduced on a fresh CPU-only run with as few as
    # 1-5 epochs, independent of lr/batch_size, and independent of the 14
    # literally-constant declared-categorical columns e.g. DrugScreen__*).
    # Traced step-by-step (log_x_cat/model_out/compute_Lt/kl_prior all finite
    # on step 1; mloss is already NaN by step 2) without finding the exact
    # internal culprit -- plausibly the ~822-categorical-column multinomial
    # diffusion term itself being numerically unstable at this width/dtype
    # mix, upstream in synthcity's plugin_ddpm/gaussian_multinomial_diffsuion.
    # Not investigated further since ddpm is one of six synthcity backends
    # here; revisit (or file upstream against vanderschaarlab/synthcity) if
    # ddpm output specifically becomes needed.
    names: [ctgan, tvae, adsgan, pategan, rtvae]

  tabpfn:
    enabled: true
    variants: [standard, custom]
    # TabPFN officially supports up to 2000 features but only ensembles over
    # random 500-feature subsets beyond that (tabpfn/inference_config.py:
    # MAX_NUMBER_OF_FEATURES). This dataset has ~1000 feature columns after the
    # drops above -- under the hard cap, but well past the full-attention
    # regime, so expect slower fits than the hepatitis example.
    data_variants: [raw, imputed]

  tabpfgen:
    enabled: true
    variants: [standard, custom]
    standard_params: {}
    custom_params: { n_sgld_steps: 1000, sgld_noise_scale: 0.1 }

  hpo:
    enabled: true
    n_trials: 100
    timeout_seconds: 300
    n_iter_cap: 300
    model_iter_caps: { pategan: 50 }
    sgld_step_cap: 500
    metric_config:
      stats: [prdc, alpha_precision, wasserstein_dist, inv_kl_divergence]
      sanity: [nearest_syn_neighbor_distance]
      performance: [xgb]
      privacy: [identifiability_score, DomiasMIA_prior]
    storage: null
    best_params_path: null
    final_n_iter_override: null

evaluation:
  output_dir: output/loris/evaluation
  models: null
  # Which class counts as "positive" for statistical_parity/equalized_odds/
  # equal_opportunity (fairness metrics) -- only takes effect if data.target_column
  # is exactly 2 classes. CGAS_class has 3+ classes here, so these metrics only
  # ever run via the binary_target pass below (which fixes its own positive class
  # via binary_target.positive_classes) -- this field is currently a no-op for
  # loris specifically; kept set for if/when the target is ever naturally binary.
  positive_class: 0

  synthcity:
    enabled: true
    categories: null
    metrics: null

  syntheval:
    enabled: true
    categories: null
    metrics: null

  custom:
    enabled: true
    categories: null
    metrics: null

  ranking_strategy: linear

  log_disparity:
    protected_columns: [Sex, Age, PreInt_Demos_Fam__Child_Race]
    target_map: { 0: severe, 1: moderate, 2: typical }
    protected_map: [{ 0: male, 1: female }, null, null]
    protected_bins: [null, [5, 8, 11, 14, 17, 22], null]

  save_per_model_syntheval_plots: true

  # auroc_diff/statistical_parity/equalized_odds/equal_opportunity all refuse to
  # run against CGAS_class as-is (SynthEval requires an exactly-2-class target
  # for these; CGAS_class has 3: 0=severe, 1=moderate, 2=typical -- see
  # data.target_column above). This runs a second, separate SynthEval pass
  # against a disposable binary collapse of CGAS_class -- 1 (positive/"clinically
  # significant impairment") = severe+moderate, 0 (negative/reference) = typical
  # -- so those 4 metrics can run too, without affecting any other metric's
  # results (which keep using the real 3-class CGAS_class) or the generated
  # data (this never touches data.target_column/imputation/generation). See
  # synthdata/evaluation/syntheval_eval.py's build_binary_target_series/
  # run_binary_target_syntheval_evaluation.
  binary_target:
    enabled: true
    column: null # defaults to data.target_column (CGAS_class)
    positive_classes: [0, 1] # severe + moderate -> "clinically significant impairment"
    negative_classes: [2] # typical -> reference/negative outcome

  # Weight applied to each type's rollup rank when computing the overall rank
  # (see synthdata/evaluation/combine.py's mean-of-means aggregation). Default
  # is equal weight; the privacy_gate below (pass/fail) is this project's
  # primary safeguard for sensitive data, not this weight -- raise "privacy"
  # here too if it should also influence relative ranking among gate-passing
  # models, not just gate them.
  rank_weights:
    utility: 1.0
    privacy: 1.0
    fairness: 1.0

  # Absolute (not merely relative-to-other-models) privacy safety floor -- see
  # configs/config.yaml's evaluation.privacy_gate comment for the full
  # rationale/caveats. Same defaults reused here; adjust if loris-specific
  # domain/compliance guidance differs from hepatitis's.
  privacy_gate:
    enabled: true
    thresholds:
      mia_recall: { bound: max, value: 0.6 }
      mia_precision: { bound: max, value: 0.6 }
      hit_rate: { bound: max, value: 0.05 }
      att_discl_risk: { bound: max, value: 0.6 }
      privacy.identifiability_score.score_OC: { bound: max, value: 0.3 }
      privacy.k-anonymization.syn: { bound: min, value: 5.0 }
      privacy.k-map.score: { bound: min, value: 5.0 }

  # Whether to write a human-readable report.md (run metadata, ranked summary,
  # privacy gate results, recommended model, fairness highlights, plot links)
  # alongside combined_evaluation.csv.
  generate_report: true

plots:
  output_dir: output/loris/plots
  sections: [data, imputation, generation, hpo, evaluation]
  dpi: 150
  formats: [png]
