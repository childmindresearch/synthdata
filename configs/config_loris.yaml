# LORIS/HBN dataset configuration. Paths are relative to the repository root.
# Copy this file and update the data section for a new dataset.

name: loris
seed: 42
device: auto

experiment:
  tag: refactored_loris_v2
  id: "2.02"

data:
  # Source and schema
  source: csv
  path: data/loris/loris_v2_664_features_us_id.csv # Input file.
  version: "2.1"
  variable_schema_path: data/loris/loris_v2_variable_schema_us.csv

  # Modeling columns
  target_column: CGAS_class # Outcome.
  stratification_variables: [CGAS_class, Sex, Age]
  stratification_bins: [null, null, ["<18", "18-30", "30-45", "45-60", ">60"]]
  canonical: true # Enables strict leakage-safe policy; validation failures abort loading.
  patient_id_column: patient_id # Direct patient identity.
  # QIs are attacker-observable predictors and release equivalence-class fields;
  # they must not overlap sensitive fields, target, or patient ID. They may
  # overlap protected fields. Attribute inference uses QIs as predictors.
  quasi_identifier_columns: [
      Age,
      Sex,
      region,
      PreInt_Demos_Fam__Child_Ethnicity,
    ]
  sensitive_columns: [
      Income,
      PreInt_TxHx__suicide,
      Diagnosis_Cat__Anxiety_Disorders,
    ] # Sensitive disclosure/attribute-inference targets; must not overlap QIs or target.
  # Protected fields define fairness groups. Explicit overlap with QIs or
  # sensitive fields is allowed; protected fields are not inferred from either.
  protected_columns: [Sex, Age, PreInt_Demos_Fam__Child_Ethnicity]
  protected_attribute_bins: [null, ["<18", "18-30", "30-45", "45-60", ">60"], null]
  drop_rows_missing_target: true
  drop_columns: null

  # Source normalization and canonical population roles
  uppercase_columns: false
  remap_binary_one_two: false
  outlier_zscore_threshold: null # Set only with confirmed corrupt/sentinel columns.
  outlier_columns: null
  split:
    mode: patient_group
    train_fraction: 0.60
    tuning_fraction: 0.20
    final_holdout_fraction: 0.20

  # Local derived-data storage
  data_dir: data/loris

imputation:
  enabled: true
  method: hyperimpute # Canonical imputation backend.
  device: auto
  cache: true
  validation_margin: 0.2
  round_to_int_default: false
  round_rules: {}
  benchmark:
    enabled: false

generation:
  output_dir: output/loris/synthetic_data
  n_samples: 100
  force_retrain: false

  synthcity:
    enabled: true
    # Bayesian network and DDPM do not scale reliably to this dataset width.
    names: [ctgan, tvae, adsgan, pategan, rtvae]
    params:
      ctgan:
        n_iter: 10
      tvae:
        n_iter: 10
      adsgan:
        n_iter: 10
      pategan:
        n_iter: 10
      rtvae:
        n_iter: 10
  tabpfn:
    enabled: true
    variants: [standard]
    data_variants: [raw]

  tabpfgen:
    enabled: true
    variants: [standard, custom]
    standard_params: {}
    custom_params: { n_sgld_steps: 1000, sgld_noise_scale: 0.1 }

  hpo:
    enabled: true
    n_trials: 5
    timeout_seconds: 300
    n_iter_cap: 10
    model_iter_caps: { pategan: 5 }
    sgld_step_cap: 2000
    metric_config:
      canonical_objectives: [tstr_macro_f1.v1]
    stage_a:
      minimum_class_count: 1
      minimum_protected_group_count: 1
      minimum_target_by_protected_group_count: 1
      dependency_rules: []
    storage: null
    best_params_path: null
    final_n_iter_override: null

evaluation:
  output_dir: output/loris/evaluation
  models: null
  positive_class: 0 # Used only if the target is naturally binary.
  ranking_strategy: linear
  generate_report: true
  save_per_model_syntheval_plots: true
  # Use patient_group only when this identifier is retained in every evaluated frame.
  group_mode: row
  group_column: null

  synthcity:
    enabled: true
    categories: null
    metrics: null
    classification_score: balanced_accuracy
    # Attribute inference: QIs are predictors and sensitive fields are targets;
    # membership/re-identification/structural screens retain distinct threats.
    structural_n_clusters: [2, 5, 10, 15]
    structural_min_rows_per_cluster: 10
  syntheval: { enabled: true, categories: null, metrics: null }
  custom: { enabled: true, categories: null, metrics: null }

  log_disparity:
    target_map: { 0: severe, 1: moderate, 2: typical }
    protected_map: [null, null, null]
    protected_bins: null

  # Evidence support only, not formal privacy guarantees; invalid values fail closed.
  # Unsupported synthetic categorical values are never coerced: affected
  # evidence is failed or indeterminate, never succeeded. Succeeded requires
  # all required tables; only succeeded evidence supplies metrics/plots/ranking.
  privacy_policy:
    role_population_floor: 20 # Synthetic/reference rows for release-privacy evidence only.
    # Final TSTR EO: minimum total, actual-positive and actual-negative rows per
    # protected group and one-vs-rest class; at least two valid groups required.
    # Provisional 1 implies at least two rows per group, not statistical confidence.
    protected_slice_floor: 1

  # Existing final-audit score normalization only; raw metrics/selection unchanged.
  # Both anchors must be finite and positive; metric reconciliation is deferred.
  scoring_policy:
    equalized_odds_gap_anchor: 0.10
    worst_absolute_log_disparity_anchor: 0.69314718056

  # Resource cap for resumable per-model SynthEval processes.
  syntheval_execution:
    model_workers: auto
    max_model_workers: 6
    cores_per_model: 4
    memory_reserve_gib: 16
    memory_per_model_gib: 14

  privacy_gate:
    # Calibration-only starting thresholds; enable only with reviewed
    # operational contract IDs after privacy calibration.
    enabled: false
    thresholds:
      mia_recall: { bound: max, value: 0.6 }
      mia_precision: { bound: max, value: 0.6 }
      hit_rate: { bound: max, value: 0.05 }
      att_discl_risk: { bound: max, value: 0.6 }
      privacy.identifiability_score.score_OC: { bound: max, value: 0.3 }
      privacy.k-anonymization.syn: { bound: min, value: 5.0 }
      privacy.k-map.score: { bound: min, value: 5.0 }

plots:
  output_dir: output/loris/plots
  sections: [data, imputation, generation, hpo, evaluation]
  dpi: 150
  formats: [png]
