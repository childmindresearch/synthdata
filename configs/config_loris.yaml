# =============================================================================
# synthdata pipeline configuration -- LORIS (HBN) mock dataset
# =============================================================================
# This single file drives all four pipeline stages:
#   synthdata-impute   --config configs/config_loris.yaml
#   synthdata-generate --config configs/config_loris.yaml
#   synthdata-evaluate --config configs/config_loris.yaml
#   synthdata-plot     --config configs/config_loris.yaml
#
# Source data: data/loris/loris_combined.csv (see notebooks/eda_loris.ipynb for
# the exploratory analysis behind every decision below). This dataset is
# considerably larger than the bundled hepatitis example in BOTH dimensions:
# ~4867 rows (vs 155) and ~1050 raw columns (vs 19) drawn from many HBN
# assessments. A few practical consequences of that scale are called out
# inline below.
# =============================================================================

name: loris
seed: 42
device: auto # auto | cpu | cuda | mps

experiment:
  tag: try_all_models_hpo
  id: "0.3"

data:
  source: csv
  path: data/loris/loris_combined.csv

  version: "1.0"

  target_column: CGAS_class # 3-class reduction of CGAS__CGAS_Score: 0 (<=44, severe),
  # 1 (45-50, moderate), 2 (>=51, typical) -- confirmed as a clean/deterministic
  # bucketing in notebooks/eda_loris.ipynb section 2.

  # ~27% of rows have no CGAS_class (the assessment wasn't administered/completed
  # for every subject). Every pipeline stage assumes a fully-observed target
  # (imputation only fills feature_columns; stratified train_test_split raises
  # on NaN), so unlabeled rows are dropped rather than having their label
  # imputed -- fabricating ground-truth labels for a supervised generation task
  # would be a fundamentally different (and much riskier) operation than
  # imputing predictor missingness. See synthdata/config.py DataConfig and
  # synthdata/data.py load_dataset for the implementation.
  drop_rows_missing_target: true

  sensitive_columns: [Sex, Age, PreInt_Demos_Fam__Child_Race]

  drop_columns:
    - subject_id # row identifier
    - CGAS__CGAS_Score # target leakage: CGAS_class is a deterministic bucketing of this column
    # Raw per-diagnosis-slot fields (free text / ICD codes, 15-93 unique values,
    # up to 65% missing across the 2nd/3rd diagnosis slots): high-cardinality
    # categorical columns like these are hard for tabular GANs/one-hot encoders
    # to model well, and their information is already captured at DSM-category
    # granularity by the derived Diagnosis_Cat__* binary flags (kept below).
    - Diagnosis_ClinicianConsensus__DX_01
    - Diagnosis_ClinicianConsensus__DX_01_Code
    - Diagnosis_ClinicianConsensus__DX_01_Cat
    - Diagnosis_ClinicianConsensus__DX_01_ByHx
    - Diagnosis_ClinicianConsensus__DX_02
    - Diagnosis_ClinicianConsensus__DX_02_Code
    - Diagnosis_ClinicianConsensus__DX_02_Cat
    - Diagnosis_ClinicianConsensus__DX_03
    - Diagnosis_ClinicianConsensus__DX_03_Code
    - Diagnosis_ClinicianConsensus__DX_03_Cat
    # Raw medication-category text (>99% missing, 6-7 categories): redundant
    # with the derived MedType__* binary flags (also kept below, despite being
    # equally sparse -- that's a missingness problem, not a reformulation one).
    - DailyMeds__med_type_01
    - DailyMeds__med_type_02
    - DailyMeds__med_type_03

  # Explicit split of feature columns into nominal (unordered categorical, 293
  # columns) and ordinal (ordered categorical, 529 columns) roles, derived from
  # data/loris/loris_variable_types.csv's measurement_level (confirmed via
  # notebooks/eda_loris.ipynb section 5b). Both roles are encoded/decoded the
  # same way by every backend (see Dataset.categorical_columns = nominal_columns
  # + ordinal_columns) -- the split exists so that (a) every ordinal column is
  # guaranteed to be routed through that encode/decode path (no more silently
  # falling through to plain continuous numeric treatment just because someone
  # forgot to add it to a single combined list -- exactly the bug that bit
  # BIA__BIA_Activity_Level, now correctly included in ordinal_columns below
  # instead of relying solely on ordinal_column_categories), and (b)
  # refidiff's bit-encoding preserves each ordinal column's true value order
  # (see refidiff_backend._fit_categorical_binary_encoders) rather than an
  # arbitrary one, which only matters for the ordinal role.
  #
  # ordinal_columns excludes 6 high-cardinality ordinal columns (the WISC
  # `*_Percentile` scores, 31-65 unique values) and includes only the 528
  # (of 536 total ordinal columns) with low cardinality (n_unique <= 10) plus
  # BIA__BIA_Activity_Level (n_unique=5, stored as text -- see
  # ordinal_column_categories below) -- the WISC percentiles are better modeled
  # as continuous; forcing them categorical buys nothing since there's no small
  # fixed category set.
  #
  # This combined list drives different encodings per backend: refidiff (this
  # config's active imputation.method) binary/bit-encodes categoricals
  # (ceil(log2(k)) columns/feature) -- cheap even with the ordinal columns
  # added, and fixes a real bug where refidiff silently imputed non-listed (but
  # integer-coded) ordinal columns as continuous. tabimpute one-hot-encodes (k
  # columns/feature) -- an earlier `nominal_columns: auto` pass (nominal+ordinal
  # via a cardinality heuristic) CUDA-OOM'd tabimpute at this dataset's width,
  # so re-verify the estimated one-hot width (notebooks/eda_loris.ipynb section
  # 5b) before ever switching imputation.method back to tabimpute or enabling
  # generation.synthcity for this dataset with this same list.
