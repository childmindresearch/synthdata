# Hepatitis example: a small public dataset (UCI id 46) that runs on a CPU.
# All paths are relative to the repository root.
#
# This file lists the options worth reviewing for every run. Anything left out
# uses its default; synthdata/config.py documents every option and default.

name: hepatitis
seed: 42 # Split, imputation, generators and metrics all derive from this.
device: auto # auto | cpu | cuda | mps

experiment:
  tag: test
  id: 0.1 # Reusing an id resumes that experiment; null makes a new one per run.

data:
  # Source and schema
  source: uci
  uci_id: 46
  version: "1.0" # Use a new value whenever the source data changes.
  variable_schema_path: configs/schemas/hepatitis_variable_schema.csv # Public data, so the schema ships with the repo.
  data_dir: data/hepatitis # Cached download, splits and imputed data.

  # Modeling columns
  target_column: target
  raw_target_column: CLASS
  # Source normalization (dataset quirks): uppercase names, 1/2 codes to 0/1.
  uppercase_columns: true
  remap_binary_one_two: true
  # Column roles (see config_sim.yaml). UCI Hepatitis has no linkable
  # identifiers beyond age and sex; the liver biopsy result is the secret.
  # Every row is a different patient, so there is no patient_id_column.
  quasi_identifier_columns: [AGE, SEX]
  sensitive_columns: [HISTOLOGY]
  protected_columns: [SEX, AGE]
  # Groups for numeric protected columns (fairness metrics, log disparity).
  protected_bins: {AGE: [7, 18, 30, 45, 60, 78]}

  # 60/20/20 split: train fits the imputer and HPO candidates, tuning scores
  # them, holdout is touched only by evaluation. Stratified on the target.
  train_fraction: 0.6
  tuning_fraction: 0.2
  holdout_fraction: 0.2

imputation:
  # Fitted on train minus tuning for HPO, then refitted on all of train.
  method: miceforest # miceforest | missforest | simple (median/mode) | tabimpute | refidiff
  round_to_int_default: true # Round imputed values unless round_rules says otherwise.
  round_rules: { BILIRUBIN: 2, ALBUMIN: 1 }

generation:
  output_dir: output/hepatitis/synthetic_data
  # Synthetic rows per model. null = as many as the real rows the model is
  # fitted on (train for final models, search-train for HPO candidates), the
  # usual convention: more rows add no real signal but more chances to leak.
  # An integer caps it (e.g. for slow TabPFN); the TRTR ceiling then uses that
  # many real train rows too.
  n_samples: null
  # Seed replicates per model; 2+ gives every score a 95% interval.
  n_replicates: 3 # Small data, so intervals are cheap here.

  synthcity:
    enabled: true
    names: [ctgan, tvae, adsgan, bayesian_network, pategan, rtvae, ddpm, arf]

  tabpfn:
    enabled: true
    variants: [standard, custom]
    data_variants: [raw, imputed]
    model_version: v3.5 # TabPFN weights; each version needs its license accepted (user manual).

  # Off: TabPFGen outputs near-copies of training rows (docs/verification.md).
  tabpfgen:
    enabled: false

  # Resample synthetic data to the real train class shares.
  match_class_prior: true

  hpo:
    enabled: true
    # Objective scored on the tuning split by a fixed XGBoost trained on the
    # synthetic rows; auto picks one of the candidates per model (see
    # config_sim.yaml and docs/user_manual.md).
    objective: auto
    # Screens a trial must pass to be chosen as best (the protected-column and
    # memorization screens keep their defaults).
    constraints: { copy_margin: 0.02, min_category_coverage: 0.8, max_out_of_range: 0.01, max_class_share_gap: 0.02 }
    n_trials: 10
    timeout_seconds: 600
    # Training length searched per model, [low, high, step]: shortened from the
    # libraries' ranges to keep this small CPU demo quick.
    epoch_ranges:
      { ctgan: [100, 300, 100], adsgan: [100, 300, 100], pategan: [1, 5, 1] }
    pruner: null

evaluation:
  output_dir: output/hepatitis/evaluation
  positive_class: 1 # Used only if the target is naturally binary.
  # Fixed reference rows scored next to the generators: real train rows
  # (utility ceiling, privacy floor) and independent column marginals.
  baselines: [train_copy, marginals]

  # Metric selection per framework: categories (utility/privacy/fairness) or
  # exact metric names; null runs everything.
  synthcity: { enabled: true, categories: null, metrics: null }
  syntheval: { enabled: true, categories: null, metrics: null }
  custom: { enabled: true, categories: null, metrics: null }

  log_disparity:
    protected_columns: [SEX, AGE]
    target_map: { 0: died, 1: survived }
    protected_map: [{ 0: male, 1: female }, null]

  # Overall rank = weighted geometric mean of the utility, privacy and
  # fairness ranks.
  rank_weights: { utility: 1.0, privacy: 1.0, fairness: 1.0 }

plots:
  output_dir: output/hepatitis/plots
