# Hepatitis example (UCI id 46). All paths are relative to the repository root.

name: hepatitis
seed: 42
device: auto

experiment:
  tag: hepatitis
  id: "0.1" # Set to resume or extend a specific experiment.

data:
  # Source and schema
  source: uci # Downloads public data on a cache miss; use csv/parquet for local-only input.
  uci_id: 46
  path: null # Required for csv/parquet sources.
  version: "1.1" # Use a new value when the source data changes.
  variable_schema_path: data/hepatitis/hepatitis_variable_schema.csv

  # Modeling columns
  target_column: target
  raw_target_column: CLASS
  stratification_variables: [target, SEX]
  stratification_bins: [null, null]
  canonical: true # Enables strict leakage-safe policy; validation failures abort loading.
  # QIs are attacker-observable predictors and release equivalence-class fields;
  # they must not overlap sensitive fields or the target. They may overlap
  # protected fields. Attribute inference uses QIs as predictors.
  quasi_identifier_columns: [AGE, SEX]
  sensitive_columns: [HISTOLOGY, ANTIVIRALS] # Disclosure/attribute-inference targets.
  # Protected fields define fairness groups. The sample has 155 patients, so age
  # uses coarse bins; finer bins leave single-row groups.
  protected_columns: [SEX, AGE]
  protected_attribute_bins: [null, ["<30", "30-45", "45-60", ">60"]]
  drop_rows_missing_target: false
  drop_columns: []

  # Source normalization and canonical population roles
  uppercase_columns: true
  remap_binary_one_two: true
  outlier_zscore_threshold: null
  outlier_columns: []
  split:
    mode: patient_group
    train_fraction: 0.60
    tuning_fraction: 0.20
    final_holdout_fraction: 0.20
    # The UCI table has one row per patient and no identity column, so each
    # row is its own patient group.
    one_row_per_patient: true
    candidate_count: 32

  # Local derived-data storage
  data_dir: data/hepatitis
  raw_cache_subdir: raw

imputation:
  enabled: true
  method: hyperimpute # Canonical imputation backend.
  device: auto
  cache: true
  validation_margin: 0.2
  round_to_int_default: true
  round_rules: { BILIRUBIN: 2, ALBUMIN: 1 }
  benchmark:
    enabled: false

generation:
  output_dir: output/hepatitis/synthetic_data
  n_samples: 200
  force_retrain: false

  synthcity:
    enabled: true
    names: [ctgan, tvae, adsgan, bayesian_network, pategan, rtvae, ddpm]

  tabpfn:
    enabled: true
    variants: [standard, custom]
    data_variants: [raw, imputed]

  tabpfgen:
    enabled: true
    variants: [standard, custom]
    standard_params: {}
    custom_params: { n_sgld_steps: 1000, sgld_noise_scale: 0.1 }

  hpo:
    enabled: true
    n_trials: 10
    timeout_seconds: 600
    n_iter_cap: 300
    model_iter_caps: { pategan: 5 }
    sgld_step_cap: 500
    metric_config:
      canonical_objectives: [tstr_macro_f1.v1]
    stage_a:
      minimum_class_count: 1
      minimum_protected_group_count: 1
      minimum_target_by_protected_group_count: 1
      dependency_rules: []
    storage: null
    best_params_path: null
    final_n_iter_override: null

evaluation:
  output_dir: output/hepatitis/evaluation
  models: null # Null evaluates every generated model.
  positive_class: 1
  ranking_strategy: linear
  generate_report: true
  save_per_model_syntheval_plots: true
  # Use patient_group only when this identifier is retained in every evaluated frame.
  group_mode: row
  group_column: null

  synthcity:
    enabled: true
    categories: null
    metrics: null
    classification_score: balanced_accuracy
    # Attribute inference: QIs are predictors and sensitive fields are targets;
    # membership/re-identification/structural screens retain distinct threats.
    structural_n_clusters: [2, 5, 10, 15]
    structural_min_rows_per_cluster: 10
  syntheval: { enabled: true, categories: null, metrics: null }
  custom: { enabled: true, categories: null, metrics: null }

  log_disparity:
    target_map: { 0: died, 1: survived }
    protected_map: [{ 0: male, 1: female }, null] # Aligned with data.protected_columns.
    protected_bins: null

  # Evidence support only, not formal privacy guarantees; invalid values fail closed.
  # Unsupported synthetic categorical values are never coerced: affected
  # evidence is failed or indeterminate, never succeeded. Succeeded requires
  # all required tables; only succeeded evidence supplies metrics/plots/ranking.
  privacy_policy:
    role_population_floor: 20 # Synthetic/reference rows for release-privacy evidence only.
    # Final TSTR EO: minimum total, actual-positive and actual-negative rows per
    # protected group and one-vs-rest class; at least two valid groups required.
    # Provisional 1 implies at least two rows per group, not statistical confidence.
    protected_slice_floor: 1

  # Existing final-audit score normalization only; raw metrics/selection unchanged.
  # Both anchors must be finite and positive; metric reconciliation is deferred.
  scoring_policy:
    equalized_odds_gap_anchor: 0.10
    worst_absolute_log_disparity_anchor: 0.69314718056

  # Resource cap for resumable per-model SynthEval processes. The dataset has
  # 20 columns, so each model needs far less memory than the automatic estimate.
  syntheval_execution:
    model_workers: auto
    max_model_workers: 4
    cores_per_model: 2
    memory_reserve_gib: 4
    memory_per_model_gib: 2
    # Largest share of holdout rows with categories absent from train that
    # cls_acc/auroc_diff/mia/att_discl resolve by mapping to the train mode;
    # above it those metrics are blocked as a material shift. 0 always blocks.
    max_holdout_unknown_row_fraction: 0.05

  privacy_gate:
    # Calibration-only starting thresholds; enable only with reviewed
    # operational contract IDs after privacy calibration.
    enabled: false
    thresholds:
      mia_recall: { bound: max, value: 0.6 }
      mia_precision: { bound: max, value: 0.6 }
      hit_rate: { bound: max, value: 0.05 }
      att_discl_risk: { bound: max, value: 0.6 }
      privacy.identifiability_score.score_OC: { bound: max, value: 0.3 }
      privacy.k-anonymization.syn: { bound: min, value: 5.0 }
      privacy.k-map.score: { bound: min, value: 5.0 }

plots:
  output_dir: output/hepatitis/plots
  sections: [data, imputation, generation, hpo, evaluation]
  dpi: 150
  formats: [png]
