# Simulated competition-shaped data (sim 1.2), used to profile and test the
# pipeline before LORIS runs. Paths are relative to the repository root; the
# data files live only on the owner's machine (data/ is git-ignored).

name: sim
seed: 42
device: auto

experiment:
  tag: sim_v1
  id: "1.2"

data:
  # Source and schema (simulated data 1.2). The CSV's first two columns are
  # identifiers that the schema leaves out: research_subject_id (one per
  # patient) and encounter_number (one per row).
  source: csv
  path: data/simulated/sim_v1.2.csv
  version: "1.2"
  variable_schema_path: data/simulated/sim_v1.2_variable_schema.csv

  # Modeling columns
  target_column: readmission_group
  patient_id_column: research_subject_id # Split by patient, then dropped before modeling.
  # Column roles. Quasi-identifiers are public, linkable attributes an
  # attacker may know; sensitive columns are the secrets privacy metrics try
  # to infer; protected columns are the fairness groups. QIs and sensitive
  # columns must not overlap; neither may hold the target or patient ID.
  # A small representative set while the final lists are being chosen.
  quasi_identifier_columns: [age_reg, birth_year, gender, region, Ethnicity]
  sensitive_columns: [Income, Anxiety disorder]
  protected_columns: [gender, age_reg, Ethnicity]
  drop_rows_missing_target: true
  drop_columns: [encounter_number]

  # Source normalization and split
  uppercase_columns: false
  remap_binary_one_two: false
  outlier_zscore_threshold: null # Set only with confirmed corrupt/sentinel columns.
  outlier_columns: null
  # Patient-level 60/20/20 split, stratified jointly by target, sex and age
  # (<30, 30-60, >=60). Strata too small to spread over the folds fall back to
  # the target alone.
  train_fraction: 0.6
  tuning_fraction: 0.2
  holdout_fraction: 0.2
  stratify_columns: [readmission_group, gender, age_reg]
  stratify_bins: [null, null, [30, 60]]

  # Local derived-data storage
  data_dir: data/simulated
  raw_cache_subdir: raw

imputation:
  enabled: true
  # Fitted on train minus tuning for HPO, then refitted on all of train.
  method: missforest # or simple (median/mode), tabimpute, refidiff
  missforest:
    n_estimators: 50
    max_iter: 5
    n_nearest_features: null
  missing_indicators:
    enabled: true
    min_missing_fraction: 0.05
    remask_synthetic: true
    # 80%+ missing: generate only the indicator, fill 'recorded' rows by CART on release.
    # null = impute and generate every column as usual.
    indicator_only_fraction: 0.8
    keep_values_columns: []
  drift_warn_threshold: 0.1
  device: auto
  cache: true
  validation_margin: 0.2
  round_to_int_default: false
  round_rules: {}
  refidiff:
    hidden_dim: 32
    epochs: 10001
    early_stopping_patience: 500
    batch_size: 8192
    num_steps: 50
    num_trials: 10
    denoiser: auto
    checkpoint_every: 1000
    catboost_warmup_iterations: 1000
  benchmark:
    enabled: false
    output_dir: output/sim/imputation
    mask_fraction: 0.3
    n_masks: 3
    mechanisms: [mcar]
    hpo:
      enabled: false
      n_trials: 12
      timeout_seconds: null
      hidden_dims: [16, 32, 64]
      num_steps: [10, 25, 50]
      num_trials: [1, 3, 5]
      epochs: [1000, 3000]
      early_stopping_patience: [100, 250]

generation:
  output_dir: output/sim/synthetic_data
  n_samples: 2500
  force_retrain: false

  synthcity:
    enabled: true
    # Bayesian network and DDPM do not scale reliably to this dataset width.
    names: [ctgan, tvae, adsgan, pategan, rtvae]

  tabpfn:
    enabled: true
    variants: [standard, custom]
    data_variants: [raw, imputed]

  tabpfgen:
    enabled: true
    variants: [standard, custom]
    standard_params: {}
    custom_params: { n_sgld_steps: 1000, sgld_noise_scale: 0.1 }

  # Resample synthetic data to the real train class shares.
  match_class_prior: true

  hpo:
    enabled: true
    n_trials: 50
    timeout_seconds: 14400
    # Per-model budgets from a GPU profiling run on sim 1.2 (search-train
    # 12600 rows x 682 columns, RTX 5070 Ti, 2026-10-08). One synthcity epoch
    # takes about 19-21 s at this width (26 s per PATE-GAN iteration);
    # TabPFGen takes about 35 s per 1000 SGLD steps. Trials: about 10 random
    # start-up trials plus 10 per tuned dimension, capped for run time.
    # Timeout = trials x mean trial time x 1.5.
    n_trials_per_model:
      { ctgan: 40, tvae: 40, adsgan: 40, rtvae: 40, pategan: 40,
        tabpfgen_standard: 25, tabpfgen_custom: 25 }
    timeout_seconds_per_model:
      { ctgan: 108000, tvae: 103000, adsgan: 100000, rtvae: 111000, pategan: 28000,
        tabpfgen_standard: 1400, tabpfgen_custom: 1200 }
    # Training length is searched, [low, high, step]. The libraries' ranges
    # (100-1000 epochs; PATE-GAN 1-500) would take 3+ hours per trial here.
    epoch_ranges:
      { ctgan: [25, 150, 25], tvae: [25, 150, 25], adsgan: [25, 150, 25],
        rtvae: [25, 150, 25], pategan: [5, 30, 5] }
    # Median pruning on synthcity's early-stopping metric (CTGAN, ADS-GAN).
    pruner: median
    pruner_startup_trials: 5
    pruner_warmup_steps: 1
    # Objective scored on the tuning split: tstr_macro_f1 (fixed XGBoost
    # trained on synthetic, tested on real), tstr_macro_auprc, or the older
    # synthcity_composite (uses metric_config below, privacy included).
    objective: tstr_macro_f1
    tstr_seeds: 3
    # Lenient sanity screens; a trial that fails one can't be chosen as best.
    constraints: { copy_margin: 0.02, min_category_coverage: 0.9, max_out_of_range: 0.01 }
    metric_config:
      stats: [prdc, alpha_precision, wasserstein_dist, inv_kl_divergence]
      sanity: [nearest_syn_neighbor_distance]
      performance: [xgb]
      privacy: [identifiability_score]
    storage: null
    best_params_path: null
    final_n_iter_override: null

evaluation:
  output_dir: output/sim/evaluation
  models: null
  positive_class: 0 # Used only if the target is naturally binary.
  ranking_strategy: linear
  generate_report: true
  save_per_model_syntheval_plots: true

  synthcity: { enabled: true, categories: null, metrics: null }
  syntheval: { enabled: true, categories: null, metrics: null }
  custom: { enabled: true, categories: null, metrics: null }

  log_disparity:
    protected_columns: [gender, age_reg, Ethnicity]
    target_map: null
    protected_map: [null, null, null]
    protected_bins: [null, [0, 18, 30, 45, 60, 200], null]

  # Metrics that need two target classes (AUROC difference, subgroup gaps) on a
  # 3+ class target: ovr_macro = once per class vs the rest, averaged with equal
  # weight (per-class values in ovr_per_class.csv); binary = once on the
  # binary_target collapse below, which must then be enabled.
  class_averaging: ovr_macro
  # XGBoost seeds averaged for holdout TSTR (fit on synthetic, score on test).
  tstr_seeds: 3
  # Custom privacy metrics (evaluation.custom names anonymeter, holdout_distance).
  # unit: patient = attacks target one encounter per patient and the distance
  # membership check scores each patient by their closest encounter; row = every
  # row is an individual. Anonymeter uses the QIs as attacker knowledge and the
  # sensitive columns as secrets, with the test split as its control set.
  privacy_attacks:
    unit: patient
    anonymeter:
      n_attacks: 500
      singling_out_mode: multivariate
      singling_out_n_cols: 3
      singling_out_max_attempts: 100000
      linkability_n_neighbors: 10
      confidence_level: 0.95
  # Binary collapse for class_averaging: binary; off until the target's classes are fixed.
  binary_target:
    enabled: false
    column: null
    positive_classes: []
    negative_classes: []

  # Resource cap for resumable per-model SynthEval processes.
  syntheval_execution:
    model_workers: 6
    max_model_workers: 6
    cores_per_model: 4
    memory_reserve_gib: 16
    memory_per_model_gib: 14

  rank_weights: { utility: 1.0, privacy: 1.0, fairness: 1.0 }
  privacy_gate:
    enabled: true
    thresholds:
      mia_recall: { bound: max, value: 0.6 }
      mia_precision: { bound: max, value: 0.6 }
      hit_rate: { bound: max, value: 0.05 }
      att_discl_risk: { bound: max, value: 0.6 }
      privacy.identifiability_score.score_OC: { bound: max, value: 0.3 }
      privacy.k-anonymization.syn: { bound: min, value: 5.0 }
      privacy.k-map.score: { bound: min, value: 5.0 }

plots:
  output_dir: output/sim/plots
  sections: [data, imputation, generation, hpo, evaluation]
  dpi: 150
  formats: [png]
