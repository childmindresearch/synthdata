# Simulated clinical data (sim 1.3), used to profile and test the
# pipeline before LORIS runs. Paths are relative to the repository root; the
# data files live only on the owner's machine (data/ is git-ignored).
#
# This file lists the options worth reviewing for every run. Anything left out
# uses its default; synthdata/config.py documents every option and default.

name: sim
seed: 42 # Split, imputation, generators and metrics all derive from this.
device: auto # auto | cpu | cuda | mps

# Models processed at once, in generation (one process per synthcity model:
# its search, final fit and replicates) and in evaluation (one process per
# synthetic dataset). auto = CPU cores // cores_per_worker, capped by free
# memory and max_workers: 6 on a 24-core, 125 GB machine.
compute:
  workers: auto
  max_workers: 8
  cores_per_worker: 4
  memory_reserve_gib: 16
  memory_per_worker_gib: 14
  fits_per_gpu: auto       # each fit on the least busy GPU, no limit; a number caps fits per GPU

experiment:
  tag: sim_v1
  id: "1.3" # Reusing an id resumes that experiment; null makes a new one per run.

data:
  # Source and schema (simulated data 1.3). The CSV's first two columns are
  # identifiers that the schema leaves out: research_subject_id (one per
  # patient) and encounter_number (one per row).
  source: csv
  path: data/simulated/sim_v1.3.csv
  version: "1.3" # Use a new value whenever the source data changes.
  variable_schema_path: data/simulated/sim_v1.3_variable_schema.csv
  data_dir: data/simulated # Cached splits and imputed data.

  # Modeling columns
  target_column: readmission_group
  patient_id_column: research_subject_id # Split by patient, then dropped before modeling.
  drop_columns: [encounter_number]
  drop_rows_missing_target: true
  # Column roles. Quasi-identifiers are public, linkable attributes an
  # attacker may know; sensitive columns are the secrets privacy metrics try
  # to infer; protected columns are the fairness groups. QIs and sensitive
  # columns must not overlap; neither may hold the target or patient ID.
  # A small representative set while the final lists are being chosen.
  quasi_identifier_columns: [age_reg, gender, region, Ethnicity]
  sensitive_columns: [Income, Anxiety disorder]
  protected_columns: [gender, age_reg, Ethnicity]
  # Groups for numeric protected columns (fairness metrics, log disparity).
  protected_bins: {age_reg: [0, 18, 30, 45, 60, 200]}

  # Patient-level 60/20/20 split: train fits the imputer and HPO candidates,
  # tuning scores them, holdout is touched only by evaluation. Stratified
  # jointly by target, sex and age (<30, 30-60, >=60); strata too small to
  # spread over the folds fall back to the target alone.
  train_fraction: 0.6
  tuning_fraction: 0.2
  holdout_fraction: 0.2
  stratify_columns: [readmission_group, gender, age_reg]
  stratify_bins: [null, null, [30, 60]]

imputation:
  # Fitted on train minus tuning for HPO, then refitted on all of train.
  method: miceforest # miceforest | missforest | simple (median/mode) | tabimpute | refidiff
  round_to_int_default: false # Keep continuous features continuous.
  missing_indicators:
    enabled: true
    min_missing_fraction: 0.05 # Columns missing this often get a <column>__missing feature.
    # 80%+ missing: generate only the indicator, fill 'recorded' rows by CART on release.
    # null = impute and generate every column as usual.
    indicator_only_fraction: 0.8
    # One flag per block of columns missing together: {name: [cols]}, "auto", or {} (off).
    # See missing_blocks.csv (synthdata-missing-blocks) before choosing.
    blocks: {}

generation:
  output_dir: output/sim/synthetic_data
  # Synthetic rows per model. null = as many as the real rows the model is
  # fitted on (train for final models, search-train for HPO candidates), the
  # usual convention: more rows add no real signal but more chances to leak.
  # An integer caps it (e.g. for slow TabPFN); the TRTR ceiling then uses that
  # many real train rows too.
  n_samples: null
  # Seed replicates per model; 2+ gives every score a 95% interval.
  n_replicates: 3 # The run you report needs intervals; HPO runs once, only final fits repeat.

  synthcity:
    enabled: true
    # Bayesian network does not scale reliably to this dataset width.
    names: [ctgan, tvae, adsgan, rtvae, arf]

  tabpfn:
    enabled: true
    variants: [standard, custom]
    data_variants: [raw, imputed]
    model_version: v3.5 # TabPFN weights; each version needs its license accepted (user manual).

  # Off: TabPFGen outputs near-copies of training rows (docs/verification.md).
  tabpfgen:
    enabled: false

  # Resample synthetic data to the real train class shares.
  match_class_prior: true

  hpo:
    enabled: true
    # Objective scored on the tuning split by a fixed XGBoost trained on the
    # synthetic rows (train on synthetic, test on real). Macro AUPRC for every
    # model, so HPO gains compare across models; it is threshold-free and one
    # of the ranked holdout TSTR scores. (auto picks per model by a fixed rule
    # instead; on the sim run it chose three different objectives.) All
    # candidates are logged on every trial (scripts/hpo_analysis.py compare).
    objective: tstr_macro_auprc
    # When evaluation.xgboost_params subsample rows or columns, one TSTR fit
    # depends on its seed; 3 seeds keep that noise out of the trial scores.
    tstr_seeds: 3
    objective_candidates: [tstr_macro_auprc, tstr_macro_auroc, tstr_macro_f1]
    # Screens measured on every trial (and on the final data, checks.csv).
    # enforce: false logs them without holding trials to them (2026-10-20:
    # protected_share_gap rejected every pategan and ddpm trial on the sim
    # run). Category coverage is the minimum over all categorical columns; the
    # protected columns are held to full coverage and their group shares to
    # within 0.1 of the real ones (beyond sampling noise). dcr: share of
    # synthetic rows nearer to a train row than a tuning row (0.5 = no
    # memorization).
    constraints:
      { enforce: false, copy_margin: 0.02, min_category_coverage: 0.8, max_out_of_range: 0.01,
        max_class_share_gap: 0.02, min_protected_coverage: 1.0,
        max_protected_share_gap: 0.1, max_dcr_closer_to_train: 0.6 }
    # Stop a study after 10 trials in a row without a gain above min_delta;
    # timeouts stay as caps. 0.01 macro AUPRC is about 1.5 bootstrap SEs: on
    # the sim run, refitting with new seeds moved a trial's score about as much
    # as its bootstrap SE, so one-SE gains (min_delta null) were mostly noise.
    patience: 10
    min_delta: 0.01
    # Library defaults first, then multivariate TPE after 10 random trials;
    # the best 3 feasible trials are refitted with 2 new seeds and the best
    # mean wins. warm_start: an earlier run's optuna_studies.db (e.g. the sim
    # run) whose top configs are tried first; search_params narrows a model's
    # space (scripts/hpo_analysis.py importance shows what matters).
    enqueue_defaults: true
    warm_start: { storage: null, top_k: 3, metric: tstr_macro_auprc }
    search_params: {}
    refit_top_k: 3
    refit_seeds: 2
    # Budget for models not listed per model below.
    n_trials: 50
    timeout_seconds: 14400
    # Per-model budgets from scripts/profile_hpo.py on sim 1.2
    # (search-train 12597 rows x 682 columns), Linux box with an RTX PRO 5000
    # and 24 CPUs, four model groups running at once, 2026-10-09. Seconds per
    # epoch: CTGAN 30 (17-42 by batch size), TVAE 16, ADS-GAN 18, RTVAE 19,
    # DDPM 3.1 (1.6-4.6); PATE-GAN 54 per iteration (10 GAN epochs),
    # re-timed 2026-10-09 with generator_n_iter held at 10.
    # Trials: about 10 random start-up trials plus 10 per tuned dimension,
    # capped for run time.
    # Timeout = trials x (seconds per epoch x middle of the epoch range) x 1.5.
    # PATE-GAN: each iteration trains the GAN for 10 epochs (generator_n_iter
    # is held there, see HPO_FIXED_PARAMS); it searches 2-10 iterations.
    # ARF (CPU only, single core): early stopping held on, 10-50 trees;
    # 37 s per tree with the fork's bounded-leaf fix (2 trials, 263-1316 s,
    # 2026-10-09).
    n_trials_per_model:
      { ctgan: 40, tvae: 40, adsgan: 40, rtvae: 40, pategan: 40, ddpm: 40, arf: 25 }
    timeout_seconds_per_model:
      { ctgan: 155000, tvae: 160000, adsgan: 95500, rtvae: 188000, pategan: 19500,
        ddpm: 103000, arf: 42000 }
    # Training length is searched, [low, high, step]. The libraries' ranges
    # (100-1000 epochs; PATE-GAN 1-500) would take 3+ hours per trial here.
    # The top also caps the untuned default model, which would otherwise
    # train for the library default (CTGAN 2000, ADS-GAN 10000 epochs).
    # TVAE and RTVAE go to 300 (2026-10-20): on the sim run their macro AUPRC
    # rose with epochs and their best trials sat at the old 150 cap; their
    # timeouts above were raised by the same factor (mean epochs x1.9).
    epoch_ranges:
      { ctgan: [25, 150, 25], tvae: [25, 300, 25], adsgan: [25, 150, 25],
        rtvae: [25, 300, 25], pategan: [2, 10, 2], ddpm: [100, 1000, 100] }
    # Median pruning on synthcity's GAN detection metric: off, it sat at 1.000
    # for every GAN trial on the sim run and never checked the shortest ones.
    pruner: null

evaluation:
  output_dir: output/sim/evaluation
  positive_class: 0 # Used only if the target is naturally binary.
  # Accepted rules from synthdata-profile (dependencies.csv / missing_blocks.csv
  # rows you keep) to check synthetic data against; null = off.
  dependency_rules: null
  # Fixed reference rows scored next to the generators: real train rows
  # (utility ceiling, privacy floor) and independent column marginals.
  baselines: [train_copy, marginals]

  # Metric selection per framework: categories (utility/privacy/fairness) or
  # exact metric names; null runs everything.
  synthcity: { enabled: true, categories: null, metrics: null }
  syntheval: { enabled: true, categories: null, metrics: null }
  custom: { enabled: true, categories: null, metrics: null }

  log_disparity:
    protected_columns: [gender, age_reg, Ethnicity]

  # Metrics that need two target classes (AUROC difference, subgroup gaps) on a
  # 3+ class target: ovr_macro = once per class vs the rest, averaged with equal
  # weight (per-class values in ovr_per_class.csv); binary = once on the
  # binary_target collapse (see config_loris.yaml), which must then be enabled.
  class_averaging: ovr_macro
  # XGBoost that predicts the target in holdout TSTR, the HPO objective, its
  # real-data ceiling and the fairness gaps. null = defaults (80 trees, depth 4,
  # learning rate 0.08, no subsampling). To tune it on the real train rows, run
  # python -m scripts.tune_tstr_xgboost --config <this file> and paste the
  # printed line here. With subsample/colsample_bytree below 1 the fit depends
  # on its seed: tstr_seeds (3) averages that out here, and
  # generation.hpo.tstr_seeds (3) in the HPO objective. Changing it changes the
  # HPO objective, so use a new experiment id.
  xgboost_params: null
  # Custom privacy metrics (Anonymeter, holdout-referenced DCR/NNDR).
  # unit: row = every row is an individual (each synthetic row is released as its
  # own record); patient = attacks target one encounter per patient and the
  # distance membership check scores each patient by their closest encounter. Anonymeter uses the QIs as attacker knowledge and the
  # sensitive columns as secrets, with the test split as its control set.
  privacy_attacks:
    unit: row
    anonymeter: { n_attacks: 500 }


  # Overall rank = weighted geometric mean of the utility, privacy and
  # fairness ranks.
  rank_weights: { utility: 1.0, privacy: 1.0, fairness: 1.0 }

plots:
  output_dir: output/sim/plots
